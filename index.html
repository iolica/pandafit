<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141c">
  <title>PandaFit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="boas-vindas" class="tela" hidden></section>

<div id="principal" hidden>
  <header class="topo">
    <img class="logo" src="icon-192.png" alt="">
    <div>
      <h1>PandaFit</h1>
      <span id="sub-topo" class="sub"></span>
    </div>
    <button class="botao-icone" data-acao="abrir-config" aria-label="Opções">⚙</button>
  </header>

  <main class="tela">
    <section id="tela-inicio" hidden></section>
    <section id="tela-treino" hidden></section>
    <section id="tela-jejum" hidden></section>
    <section id="tela-dieta" hidden></section>
    <section id="tela-corpo" hidden></section>
  </main>

  <div id="barra-descanso" class="barra-descanso" hidden>
    <span>Descanso <strong id="tempo-descanso">00:00</strong></span>
    <button class="botao-mini" data-acao="descanso-mais">+15 s</button>
    <button class="botao-mini" data-acao="descanso-pular">Pular</button>
  </div>

  <nav class="nav-baixo">
    <button data-acao="ir" data-aba="inicio"><span>🏠</span>Início</button>
    <button data-acao="ir" data-aba="treino"><span>🏋️</span>Treino</button>
    <button data-acao="ir" data-aba="jejum"><span>⏳</span>Jejum</button>
    <button data-acao="ir" data-aba="dieta"><span>🍽️</span>Dieta</button>
    <button data-acao="ir" data-aba="corpo"><span>📏</span>Corpo</button>
  </nav>
</div>

<div id="folha" class="folha" hidden>
  <div class="folha-corpo">
    <div class="folha-topo">
      <strong id="folha-titulo"></strong>
      <button class="botao-icone" data-acao="fechar-folha" aria-label="Fechar">✕</button>
    </div>
    <div id="folha-conteudo"></div>
  </div>
</div>

<div id="aviso-rapido" class="aviso-rapido" hidden></div>
<div id="dica-grafico" class="dica-grafico" hidden></div>

<script src="firebase-config.js"></script>
<script src="exercicios.js"></script>
<script src="alimentos.js"></script>
<script src="nucleo.js"></script>
<script src="treino.js"></script>
<script src="jejum.js"></script>
<script src="dieta.js"></script>
<script src="leitor.js"></script>
<script src="corpo.js"></script>
<script src="inicio.js"></script>
<script src="nuvem.js"></script>
<script src="app.js"></script>
</body>
</html>
